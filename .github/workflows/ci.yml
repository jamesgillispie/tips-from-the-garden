name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick, sqlite3, pdo_sqlite, mbstring, intl
          coverage: none

      # flux-pro is a paid private repo. Add FLUX_USERNAME / FLUX_LICENSE_KEY
      # as repository secrets (Settings → Secrets → Actions) — they are the
      # values in your local auth.json.
      - name: Authenticate private Composer repo
        run: |
          composer config --global http-basic.composer.fluxui.dev \
            "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

      # phpunit.xml is self-contained (app key, fake drivers, in-memory sqlite),
      # so no .env or database service is needed here.
      - name: Run tests
        run: php artisan test

  assets:
    name: Front-end build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run build
